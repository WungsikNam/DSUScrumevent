<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Wake Your Brain!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        min-height: 100dvh;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        color: #123524;
        background: linear-gradient(180deg, #f8fcf8 0%, #edf7ef 100%);
        overflow-x: hidden;
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(circle at 10% 16%, rgba(59, 162, 107, 0.12) 0%, transparent 42%),
          radial-gradient(circle at 88% 14%, rgba(25, 135, 84, 0.1) 0%, transparent 40%),
          radial-gradient(circle at 76% 82%, rgba(92, 191, 141, 0.08) 0%, transparent 38%);
      }
      button { cursor: pointer; border: none; outline: none; font-family: inherit; }
      input { font-family: inherit; }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('copy', e => e.preventDefault());
      document.addEventListener('paste', e => e.preventDefault());
      document.addEventListener('cut', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && ['c','v','x','a'].includes(e.key.toLowerCase())) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
